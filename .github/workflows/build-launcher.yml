name: Build PC Game Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-i686-gcc

      - name: Build x64
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra launcher.cpp -o PCGameLauncher-x64.exe -mwindows -lcomdlg32 -lshell32

      - name: Build x86
        shell: msys2 {0}
        run: |
          export PATH=/mingw32/bin:$PATH
          i686-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra launcher.cpp -o PCGameLauncher-x86.exe -mwindows -lcomdlg32 -lshell32

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: PCGameLauncher-Windows
          path: |
            PCGameLauncher-x64.exe
            PCGameLauncher-x86.exe
